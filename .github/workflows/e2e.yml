# 画面の E2E テスト（tests/e2e）を流す
# 手元と同じく Docker Compose（docker-compose.e2e.yml）で app と runner を動かす。動かし方は tests/e2e/README.md
name: E2E

on:
  push:
    # CESCHI-251 は E2E を入れる作業のブランチ。プルリクエストを作る前に Actions で確かめるため（マージする前に外す）
    branches: [master, develop, CESCHI-251]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチ・プルリクエストで新しく動いたら、前の実行は止める
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # 全体で 20〜30 分ほど（インポートのテストが毎分 0 秒の取り込みを順に待つ）
    timeout-minutes: 60
    env:
      # playwright.config.ts が見る（リトライ・test.only の禁止・レポートの形）
      CI: "true"
      COMPOSE: docker compose -p carble-e2e -f docker-compose.e2e.yml --profile runner
    steps:
      - uses: actions/checkout@v4

      - name: イメージを作る
        run: $COMPOSE build runner app

      - name: 型の検査
        run: $COMPOSE run --rm --no-deps runner pnpm run typecheck

      # 外部仕様 → テスト設計 → テストの対応（docs/test-design/README.md の「検査」）
      - name: テスト設計の検査
        run: $COMPOSE run --rm --no-deps runner pnpm run check:test-design

      - name: E2E テスト
        run: bash tests/e2e/scripts/run.sh
        env:
          E2E_SKIP_BUILD: "1"

      - name: 結果を残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            tests/e2e/compose-logs/
          if-no-files-found: ignore
          retention-days: 14

  # カバレッジ。上の e2e と並べて流す。app はソースマップ付きの別のイメージ（docker-compose.e2e.coverage.yml）なので、
  # 本番と同じイメージで確かめる e2e とは分ける。要約は実行のページの Summary に、レポートは artifact の e2e-coverage に出す
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      E2E_COVERAGE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: E2E テスト（カバレッジを取る）
        run: bash tests/e2e/scripts/run.sh

      - name: 要約を Summary に出す
        if: ${{ !cancelled() }}
        run: |
          if [ -f tests/e2e/coverage/coverage-summary.md ]; then
            cat tests/e2e/coverage/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: レポートを残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: tests/e2e/coverage/
          if-no-files-found: ignore
          retention-days: 14
