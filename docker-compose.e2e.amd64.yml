# runner を x64 で動かす（docker-compose.e2e.yml に重ねる。scripts/run.sh が E2E_RUNNER_AMD64=1 のときに使う）
#
# VRT（*.visual.spec.ts）の正解の画像を、CI（GitHub Actions。x64）と同じ環境で撮るため。
# arm64 の Chromium は、文字の縁の色が 1 段違う画素が出る（比べるときの許し幅に収まるので、比べるだけなら arm64 でよい）。
# Apple シリコンの Mac では x64 の動作を模倣して動くので遅く、Chromium がときどき落ちる。VRT の画像を撮り直すときだけ使う
services:
  runner:
    # 形式ごとにイメージを分ける（E2E_SKIP_BUILD で、違う形式のイメージを使わないように）
    image: carble-e2e-runner-amd64
    platform: linux/amd64
