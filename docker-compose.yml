version: '3'

services:
  app:
    tty: true
    stdin_open: true
    build:
      context: .
      target: app
    volumes:
      - ./storage:/carble/storage
    environment:
      NITRO_PORT: ${NUXT_PORT:-3000}
      NUXT_BASIC_AUTH_USER: ${NUXT_BASIC_AUTH_USER}
      NUXT_BASIC_AUTH_PASSWORD: ${NUXT_BASIC_AUTH_PASSWORD}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_IP_HEADERS: ${BETTER_AUTH_IP_HEADERS:-}
      BETTER_AUTH_TRUSTED_PROXIES: ${BETTER_AUTH_TRUSTED_PROXIES:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - ${NUXT_PORT:-3000}:${NUXT_PORT:-3000}
    restart: always
