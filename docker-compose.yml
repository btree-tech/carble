version: '3'

services:
  app:
    tty: true
    stdin_open: true
    build:
      context: .
      target: app
    volumes:
      - ./storage:/carble/storage
    environment:
      NUXT_PORT: ${NUXT_PORT:-3000}
      NUXT_BASIC_AUTH_USER: ${NUXT_BASIC_AUTH_USER}
      NUXT_BASIC_AUTH_PASSWORD: ${NUXT_BASIC_AUTH_PASSWORD}
    ports:
      - ${NUXT_PORT:-3000}:${NUXT_PORT:-3000}
