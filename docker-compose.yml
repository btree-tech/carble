version: '3'

services:
  app:
    tty: true
    stdin_open: true
    build:
      context: .
      target: app
    volumes:
      - ./storage:/carble/storage
    environment:
      NUXT_PORT: ${NUXT_PORT:-3000}
    ports:
      - ${NUXT_PORT:-3000}:${NUXT_PORT:-3000}

  db:
    build:
      context: .
      target: db
    volumes:
      - ./storage:/carble/storage
